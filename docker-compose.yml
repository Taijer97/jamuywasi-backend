# ==============================================================
#  JamuyWasi — Backend (API FastAPI)
#
#  Primera vez (una sola vez en el servidor):
#     docker network create jamuywasi_net
#  Levantar / actualizar:
#     docker compose up -d --build
#  Ver logs:
#     docker compose logs -f api
# ==============================================================
name: jamuywasi-backend

services:
  api:
    build: .
    image: jamuywasi/api:latest
    container_name: jamuywasi-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    # Solo accesible desde el propio servidor (127.0.0.1). El público entra por el
    # Nginx del frontend, que se conecta por la red interna jamuywasi_net.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Permite usar host.docker.internal en DATABASE_URL / MINIO_ENDPOINT
    # si MySQL o MinIO corren en el mismo servidor fuera de Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      jamuywasi_net:
        aliases:
          - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  jamuywasi_net:
    external: true
